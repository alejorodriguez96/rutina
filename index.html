<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Plan de entrenamiento</title>
<style>
  :root{
    --bg:#0f1115;
    --bg-elev:#171a21;
    --bg-card:#1c202b;
    --bg-card-2:#232838;
    --text:#f0f2f5;
    --text-dim:#9aa1b0;
    --text-faint:#6b7182;
    --border:#2a2f3c;
    --accent:#5b8cff;
    --accent-fuerza:#5b8cff;
    --accent-cardio:#33c98d;
    --accent-deporte:#ffb454;
    --accent-descanso:#6b7280;
    --warn-bg:#332a12;
    --warn-border:#8a6a1f;
    --warn-text:#ffd479;
    --ok:#33c98d;
    --radius:14px;
    --tap:48px;
  }
  [data-theme="light"]{
    --bg:#f4f5f7;
    --bg-elev:#ffffff;
    --bg-card:#ffffff;
    --bg-card-2:#eef0f4;
    --text:#181a20;
    --text-dim:#565c6b;
    --text-faint:#8991a3;
    --border:#dde1e8;
    --accent:#2f5fe0;
    --accent-fuerza:#2f5fe0;
    --accent-cardio:#0e9d68;
    --accent-deporte:#c97a10;
    --accent-descanso:#7a8190;
    --warn-bg:#fff4dc;
    --warn-border:#e8b34a;
    --warn-text:#7a5410;
    --ok:#0e9d68;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.4;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:48px;
  }
  h1,h2,h3,p,ul{margin:0;}
  button{
    font:inherit;
    color:inherit;
    background:none;
    border:none;
    cursor:pointer;
  }
  input[type=text]{font:inherit;color:inherit;}

  /* ---------- header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--bg-elev);
    border-bottom:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-top,0px));
    padding-top:10px;
  }
  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .header-titles{min-width:0;}
  .header-titles h1{font-size:19px;font-weight:700;letter-spacing:-0.2px;}
  .header-titles .objetivo{font-size:13.5px;color:var(--text-dim);margin-top:2px;}
  .header-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    width:var(--tap);height:var(--tap);
    display:flex;align-items:center;justify-content:center;
    border-radius:12px;
    background:var(--bg-card);
    border:1px solid var(--border);
    font-size:19px;
  }
  .icon-btn:active{background:var(--bg-card-2);}

  .week-select{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:10px;
  }
  .profile-select{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
  }
  .week-select button, .profile-select button{
    height:var(--tap);
    border-radius:12px;
    background:var(--bg-card);
    border:1px solid var(--border);
    font-weight:700;
    font-size:15px;
    color:var(--text-dim);
  }
  .profile-select button{font-size:13.5px;padding:0 6px;}
  .week-select button.active, .profile-select button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* ---------- main ---------- */
  main{padding:14px;max-width:640px;margin:0 auto;}

  .week-highlight{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:16px;
  }
  .week-highlight .week-label{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--accent);
    font-weight:700;
  }
  .week-highlight h2{font-size:20px;margin-top:4px;}
  .week-highlight .foco{color:var(--text-dim);margin-top:6px;font-size:15px;}
  .week-highlight .progreso{
    margin-top:10px;
    font-size:14px;
    font-weight:700;
    color:var(--ok);
  }

  section.block{margin-bottom:22px;}
  section.block > h3{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
    margin-bottom:10px;
    padding-left:2px;
  }

  /* ---------- session cards ---------- */
  .session-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
    border-left:4px solid var(--tipo-color, var(--accent));
  }
  .session-card[data-tipo="fuerza"]{--tipo-color:var(--accent-fuerza);}
  .session-card[data-tipo="cardio"]{--tipo-color:var(--accent-cardio);}
  .session-card[data-tipo="deporte"]{--tipo-color:var(--accent-deporte);}
  .session-card summary{
    list-style:none;
    cursor:pointer;
    padding:13px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    min-height:var(--tap);
  }
  .session-card summary::-webkit-details-marker{display:none;}
  .session-card summary .chk-wrap{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    width:32px;height:32px;
  }
  .session-card summary input[type=checkbox]{
    width:26px;height:26px;
    accent-color:var(--ok);
  }
  .session-card summary .info{flex:1;min-width:0;}
  .session-card summary .dia{
    font-size:12px;
    color:var(--tipo-color);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .session-card summary .nombre{
    font-size:16px;
    font-weight:700;
    margin-top:1px;
  }
  .session-card summary .meta{
    font-size:13px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .session-card summary .chevron{
    flex-shrink:0;
    width:22px;height:22px;
    color:var(--text-faint);
    transition:transform .15s ease;
  }
  .session-card[open] summary .chevron{transform:rotate(180deg);}
  .session-card.completed{border-left-color:var(--ok);}
  .session-card.completed summary .nombre{color:var(--ok);}

  .session-body{
    padding:0 14px 16px;
    border-top:1px solid var(--border);
  }
  .warmup{
    margin:14px 0;
    padding:10px 12px;
    background:var(--bg-card-2);
    border-radius:10px;
    font-size:14px;
    color:var(--text-dim);
  }
  .warmup b{color:var(--text);display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px;}

  .ex-row{
    padding:12px 0;
    border-top:1px solid var(--border);
  }
  .ex-row:first-of-type{border-top:none;}
  .ex-row-head{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .ex-icon-wrap{
    flex-shrink:0;
    width:38px;height:38px;
    border-radius:10px;
    background:var(--bg-card-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
  }
  .ex-row.basico .ex-icon-wrap{
    background:color-mix(in srgb, var(--tipo-color, var(--accent)) 18%, var(--bg-card-2));
    color:var(--tipo-color, var(--accent));
  }
  .ex-order{
    flex-shrink:0;
    width:22px;
    text-align:center;
    font-size:13px;
    color:var(--text-faint);
    font-weight:700;
  }
  .ex-title{flex:1;min-width:0;}
  .ex-nombre{
    font-size:15.5px;
    font-weight:600;
  }
  .ex-row.basico .ex-nombre{font-weight:800;font-size:16.5px;}
  .ex-tag-basico{
    display:inline-block;
    font-size:10px;
    font-weight:800;
    color:var(--tipo-color,var(--accent));
    border:1px solid var(--tipo-color,var(--accent));
    border-radius:5px;
    padding:1px 5px;
    margin-left:6px;
    vertical-align:middle;
    letter-spacing:0.04em;
  }
  .ex-stats{
    display:flex;
    gap:14px;
    margin-top:8px;
    padding-left:48px;
    flex-wrap:wrap;
  }
  .stat{min-width:56px;}
  .stat .num{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;}

  .ex-extra{
    padding-left:48px;
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .peso-field{display:flex;flex-direction:column;gap:4px;}
  .peso-field label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;}
  .peso-field input{
    background:var(--bg-card-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    min-height:var(--tap);
    font-size:16px;
    color:var(--text);
  }
  .peso-field input::placeholder{color:var(--text-faint);}
  .peso-hint{font-size:12.5px;color:var(--text-faint);}
  .peso-hint b{color:var(--text-dim);font-weight:600;}

  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    min-height:var(--tap);
    padding:0 14px;
    border-radius:10px;
    background:var(--bg-card-2);
    border:1px solid var(--border);
    font-size:14px;
    font-weight:600;
    color:var(--text-dim);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn:active{background:var(--border);}
  .btn.timer-btn.running{
    background:var(--tipo-color,var(--accent));
    color:#fff;
    border-color:var(--tipo-color,var(--accent));
  }
  .btn.timer-btn .tnum{font-variant-numeric:tabular-nums;font-weight:800;}

  .tecnica-panel{
    margin-top:8px;
    padding:12px;
    background:var(--bg-card-2);
    border-radius:10px;
    font-size:14px;
    color:var(--text-dim);
  }
  .tecnica-panel .ex-icon-big{
    display:flex;justify-content:center;
    color:var(--tipo-color,var(--accent));
    margin-bottom:8px;
  }
  .tecnica-panel .tec-txt{color:var(--text);}
  .tecnica-panel .alt-title{
    margin-top:10px;font-size:11px;text-transform:uppercase;
    letter-spacing:0.04em;color:var(--text-faint);
  }
  .tecnica-panel ul{margin-top:4px;padding-left:18px;}
  .tecnica-panel li{margin-top:2px;}

  .deporte-note{
    padding:14px 0 4px;
    color:var(--text-dim);
    font-size:14.5px;
  }

  /* ---------- info sections ---------- */
  .principio{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .principio h4{font-size:15px;font-weight:700;margin-bottom:4px;}
  .principio p{font-size:14px;color:var(--text-dim);}

  .calendario-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:6px;
  }
  .cal-day{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-left:4px solid var(--tipo-color,var(--accent-descanso));
    border-radius:10px;
    padding:10px 12px;
  }
  .cal-day[data-tipo="fuerza"]{--tipo-color:var(--accent-fuerza);}
  .cal-day[data-tipo="cardio"]{--tipo-color:var(--accent-cardio);}
  .cal-day[data-tipo="deporte"]{--tipo-color:var(--accent-deporte);}
  .cal-day[data-tipo="descanso"]{--tipo-color:var(--accent-descanso);}
  .cal-day .cal-dia{width:78px;flex-shrink:0;font-weight:700;font-size:13.5px;}
  .cal-day .cal-act{font-size:14px;color:var(--text-dim);}

  .notas-block{
    background:var(--warn-bg);
    border:1px solid var(--warn-border);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .notas-block h3{color:var(--warn-text);}
  .notas-block ul{padding-left:20px;}
  .notas-block li{color:var(--warn-text);font-size:14px;margin-top:8px;}
  .notas-block li:first-child{margin-top:0;}

  .export-wrap{margin-top:22px;text-align:center;}
  .export-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:var(--tap);
    padding:0 20px;
    border-radius:12px;
    background:var(--bg-card);
    border:1px solid var(--border);
    font-weight:700;
    font-size:15px;
    color:var(--text);
  }
  .export-btn:active{background:var(--bg-card-2);}
  .footer-note{
    text-align:center;
    font-size:12px;
    color:var(--text-faint);
    margin-top:14px;
  }
  .toast{
    position:fixed;
    left:50%;bottom:20px;
    transform:translateX(-50%);
    background:var(--bg-elev);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    box-shadow:0 4px 20px rgba(0,0,0,.3);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-titles">
      <h1 id="app-title"></h1>
      <div class="objetivo" id="app-objetivo"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
    </div>
  </div>
  <div class="profile-select" id="profile-select"></div>
  <div class="week-select" id="week-select"></div>
</header>

<main>
  <div class="week-highlight" id="week-highlight"></div>
  <section class="block" id="sessions-block">
    <h3>Sesiones</h3>
    <div id="sessions"></div>
  </section>

  <section class="block" id="principios-block">
    <h3>Principios del plan</h3>
    <div id="principios"></div>
  </section>

  <section class="block" id="calendario-block">
    <h3>Semana tipo</h3>
    <div class="calendario-grid" id="calendario"></div>
  </section>

  <section class="block" id="notas-block-wrap">
    <div class="notas-block">
      <h3>Advertencias y recordatorios</h3>
      <ul id="notas"></ul>
    </div>
  </section>

  <div class="export-wrap">
    <button class="export-btn" id="export-btn">⬇️ Exportar registro guardado</button>
  </div>
  <div class="footer-note">Los datos se guardan solo en este dispositivo.</div>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DATOS DEL PLAN (embebidos, sin fetch para funcionar en file://)
   ========================================================= */
const PLANES = { propia: {"meta":{"titulo":"Plan de entrenamiento - Mes 1","objetivo":"Perdida de grasa conservando masa muscular","perfil":{"edad":30,"alturaCm":180,"sexo":"masculino","nivel":"Intermedio en fuerza, irregular en constancia","deportesActuales":["Futbol semanal","Padel ocasional"],"limitaciones":"Evitar impacto repetido (trote, saltos, pliometria) por la carga articular."},"duracionSemanas":4,"sesionesFuerzaPorSemana":3,"generadoPor":"Claude"},"principios":[{"titulo":"Full body, no rutina dividida","detalle":"Cada sesion toca todo el cuerpo. Si faltas un dia no queda ningun grupo muscular sin entrenar esa semana. Es el formato que mejor tolera la falta de constancia."},{"titulo":"RIR: repeticiones en reserva","detalle":"Un RIR de 2 significa terminar la serie pudiendo hacer 2 repeticiones mas. No se llega al fallo salvo indicacion. Es el metodo mas simple para regular la carga sin calcular porcentajes."},{"titulo":"Progresion semanal","detalle":"Si completas todas las series en el rango alto de repeticiones con el RIR indicado, subi el peso la proxima sesion. Si no llegas al rango bajo, mantene o baja."},{"titulo":"Sesion minima","detalle":"En un dia sin ganas: entrenas solo los primeros dos ejercicios y te vas. Cuenta como dia cumplido. La regla existe para no romper la racha."},{"titulo":"Caminata diaria","detalle":"8.000 a 10.000 pasos todos los dias, incluidos los de descanso. Es la variable que mas gasto calorico aporta en el conjunto de la semana y no interfiere con la recuperacion."},{"titulo":"La balanza no es el unico marcador","detalle":"Registra tambien los pesos levantados y el perimetro de cintura. Es habitual que el peso corporal se estanque mientras la composicion corporal sigue mejorando."}],"calendarioSemanal":[{"dia":"Lunes","actividad":"Fuerza - Dia A","tipo":"fuerza"},{"dia":"Martes","actividad":"Descanso activo: caminata 40-50 min","tipo":"descanso"},{"dia":"Miercoles","actividad":"Fuerza - Dia B","tipo":"fuerza"},{"dia":"Jueves", rcicios":[]}]}],"notas":["Antes de arrancar, si no tenes un chequeo cardiologico reciente, hacete uno con ergometria. Es lo indicado antes de empezar trabajo de intensidad con este peso corporal.","El entrenamiento por si solo mueve poco la aguja de la balanza. El deficit calorico es lo que baja los kilos; la fuerza esta para que lo que se pierda sea grasa y no musculo.","Priorizar una ingesta alta de proteina para preservar masa muscular durante el deficit. Consultar con un nutricionista para ajustar las cantidades al caso concreto.","Dormir 7 horas o mas. Con poco sueno cae el rendimiento en el gimnasio y aumenta el apetito.","Si aparece dolor articular puntual (no la molestia muscular normal), cambiar por la alternativa indicada en el ejercicio y consultar si persiste."]}, hermana: {"meta":{"titulo":"Plan de entrenamiento - Mes 1","objetivo":"Recomposicion corporal: ganar musculo manteniendo el peso corporal","perfil":{"edad":26,"alturaCm":166,"sexo":"femenino","nivel":"Avanzada: mas de 3 anios de entrenamiento con pesas, tecnica consolidada","deportesActuales":["Cardio 1 o 2 veces por semana: correr, bici o natacion"],"limitaciones":"Ninguna informada. Ajustar si hay lesiones o molestias previas."},"duracionSemanas":4,"sesionesFuerzaPorSemana":3,"generadoPor":"Claude"},"principios":[{"titulo":"Division tren inferior / tren superior / full body","detalle":"Con tres dias y experiencia previa, este esquema permite dar a cada grupo muscular dos estimulos semanales sin sesiones eternas. Cuadriceps, gluteos y espalda se trabajan dos veces por semana."},{"titulo":"RIR: repeticiones en reserva","detalle":"RIR 2 significa terminar la serie pudiendo hacer 2 repeticiones mas con buena tecnica. Solo la ultima serie de los basicos en la semana 3 se acerca al fallo."},{"titulo":"Sobrecarga progresiva","detalle":"Si se completan todas las series en el extremo alto del rango con el RIR indicado, se sube el peso en la siguiente sesion. Es el unico motor real del progreso a este n la recuperacion del gimnasio.","alternativas":["Bicicleta","Natacion","Eliptica","Caminata en pendiente"]}]},{"id":"s3-cardio2","clave":"CARDIO","tipo":"cardio","diaSugerido":"Sabado","nombre":"Intervalos (opcional)","duracionEstimadaMin":25,"entradaEnCalor":"8 min suaves + 3 aceleraciones progresivas cortas antes del primer intervalo.","ejercicios":[{"orden":1,"ejercicioId":"hiit","nombre":"6 x 1 min fuerte / 2 min suave","grupo":"Cardiovascular","series":6,"reps":"1 min fuerte + 2 min de recuperacion","rir":null,"descansoSegundos":120,"esBasico":false,"tecnica":"El minuto fuerte es intenso pero sostenible: el ultimo intervalo tiene que salir al mismo ritmo que el primero. Preferir bici o natacion para no sumar impacto encima del dia de piernas.","alternativas":["Bici: 6 x 1 min","Natacion: 8 x 50 m fuerte","Remo ergometro: 6 x 250 m"]}]},{"id":"s3-caminata","clave":"MOVILIDAD","tipo":"deporte","diaSugerido":"Domingo","nombre":"Descanso activo: caminata larga o movilidad","duracionEstimadaMin":40,"entradaEnCalor":"No hace falta. Caminata tranquila al aire libre, o 20 min de movilidad de cadera, tobillo y columna toracica si hay rigidez acumulada.","ejercicios":[]}]},{"numero":4,"titulo":"Descarga","foco":"Semana de descarga planificada: mitad del volumen, mismas cargas aproximadas, lejos del fallo. No es una semana perdida, es donde el cuerpo asimila las tres anteriores. El mes 2 arranca desde los maximos de la semana 3.","sesiones":[{"id":"s4-a","clave":"A","tipo":"fuerza","diaSugerido":"Lunes","nombre":"Dia A - Tren inferior (enfasis cadera)","duracionEstimadaMin":50,"entradaEnCalor":"5 min de cardio suave + movilidad de cadera y hombro + 2 series ascendentes del primer ejercicio antes de la serie efectiva.","ejercicios":[{"orden":1,"ejercicioId":"peso_muerto_rumano","nombre":"Peso muerto rumano con barra","grupo":"Isquiotibiales y gluteos","series":2,"reps":"6-10","rir":4,"descansoSegundos":150,"esBasico":true,"tecnica":"Cadera hacia atras con rodillas semifle der.","alternativas":["Gemelos en prensa","Gemelos sentada"]},{"orden":7,"ejercicioId":"dead_bug","nombre":"Dead bug","grupo":"Core","series":2,"reps":"10 por lado","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"Lumbar pegada al piso durante todo el ejercicio. Si se despega, reducir el rango del brazo y la pierna.","alternativas":["Hollow hold","Plancha con peso en la espalda"]}]},{"id":"s4-b","clave":"B","tipo":"fuerza","diaSugerido":"Miercoles","nombre":"Dia B - Tren superior completo","duracionEstimadaMin":50,"entradaEnCalor":"5 min de cardio suave + movilidad de cadera y hombro + 2 series ascendentes del primer ejercicio antes de la serie efectiva.","ejercicios":[{"orden":1,"ejercicioId":"press_banca","nombre":"Press de banca con barra","grupo":"Pecho","series":2,"reps":"6-10","rir":4,"descansoSegundos":150,"esBasico":true,"tecnica":"Escapulas retraidas y deprimidas, pies firmes en el piso. Codos a 45 grados del torso. Bajada controlada tocando el esternon.","alternativas":["Press plano con mancuernas","Press en maquina"]},{"orden":2,"ejercicioId":"dominadas","nombre":"Dominadas asistidas","grupo":"Espalda","series":2,"reps":"6-10","rir":4,"descansoSegundos":150,"esBasico":true,"tecnica":"Iniciar el movimiento bajando las escapulas antes de flexionar los codos. Bajar completo entre repeticiones.","alternativas":["Jalon al pecho","Dominadas con banda elastica"]},{"orden":3,"ejercicioId":"press_militar","nombre":"Press militar sentada con mancuernas","grupo":"Hombros","series":2,"reps":"8-12","rir":4,"descansoSegundos":150,"esBasico":true,"tecnica":"Respaldo alto, core firme, costillas abajo. No arquear la lumbar para completar la repeticion.","alternativas":["Press en maquina","Press militar con barra de pie"]},{"orden":4,"ejercicioId":"remo_polea","nombre":"Remo en polea baja","grupo":"Espalda","series":2,"reps":"10-12","rir":4,"descansoSegundos":150,"esBasico":true,"tecnica":"Torso quieto, llevar los codos hacia atras pegados al cuerpo. Pausa de medio segundo apretando las escapulas.","alternativas":["Remo con mancuerna a un brazo","Remo en maquina con pecho apoyado"]},{"orden":5,"ejercicioId":"elevaciones_laterales","nombre":"Elevaciones laterales","grupo":"Hombro lateral","series":2,"reps":"12-20","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"Peso liviano, subir hasta la altura del hombro, bajada lenta. Sin impulso de cadera. Es el ejercicio que mas cambia la forma del hombro.","alternativas":["Elevaciones en polea","Elevaciones en maquina"]},{"orden":6,"ejercicioId":"face_pull","nombre":"Face pull","grupo":"Hombro posterior","series":2,"reps":"15-20","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"Polea a la altura de la cara, llevar la cuerda hacia la frente separando las manos y rotando hacia afuera.","alternativas":["Pajaro con mancuernas","Aperturas invertidas en maquina"]},{"orden":7,"ejercicioId":"curl_biceps","nombre":"Curl de biceps con barra Z","grupo":"Biceps","series":2,"reps":"10-12","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"Sin balanceo del torso. Bajada completa hasta extender el codo.","alternativas":["Curl con mancuernas alternado","Curl en banco inclinado"]},{"orden":8,"ejercicioId":"triceps_polea","nombre":"Extension de triceps en polea","grupo":"Triceps","series":2,"reps":"12-15","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"Codos pegados al torso y quietos. Extension completa al final.","alternativas":["Fondos en maquina asistida","Extension sobre la cabeza con mancuerna"]}]},{"id":"s4-c","clave":"C","tipo":"fuerza","diaSugerido":"Viernes","nombre":"Dia C - Full body (enfasis cuadriceps y espalda)","duracionEstimadaMin":50,"entradaEnCalor":"5 min de cardio suave + movilidad de cadera y hombro + 2 series ascendentes del primer ejercicio antes de la serie efectiva.","ejercicios":[{"orden":1,"ejercicioId":"sentadilla","nombre":"Sentadilla con barra","grupo":"Cuadriceps y gluteos","series":2,"reps":"6-10","rir":4,"descansoSegundos":150,"esBasico":true,"tecnica":"Profundidad hasta donde la pelvis no rote hacia atras. Rodillas siguiendo la linea de los pies. Core firme durante toda la serie.","alternativas":["Hack squat","Sentadilla frontal","Prensa 45 grados"]},{"orden":2,"ejercicioId":"remo_barra","nombre":"Remo con barra","grupo":"Espalda","series":2,"reps":"8-12","rir":4,"descansoSegundos":150,"esBasico":true,"tecnica":"Torso a unos 45 grados, espalda neutra. Llevar la barra al ombligo. Sin usar impulso de cadera para levantar el peso.","alternativas":["Remo en barra T","Remo con mancuernas a dos manos"]},{"orden":3,"ejercicioId":"zancadas","nombre":"Zancadas caminando","grupo":"Cuadriceps y gluteos","series":2,"reps":"10-12 por pierna","rir":4,"descansoSegundos":150,"esBasico":true,"tecnica":"Pasos largos, rodilla trasera casi tocando el piso. Torso erguido.","alternativas":["Zancada estatica","Step-up a cajon"]},{"orden":4,"ejercicioId":"press_inclinado","nombre":"Press inclinado con mancuernas","grupo":"Pecho","series":2,"reps":"10-12","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"Banco a 30 grados. Mas inclinacion carga el hombro sin dar mas pecho.","alternativas":["Press inclinado en maquina","Aperturas en polea"]},{"orden":5,"ejercicioId":"extension_cuadriceps","nombre":"Extension de cuadriceps","grupo":"Cuadriceps","series":2,"reps":"12-15","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"Pausa de 1 segundo arriba, bajada controlada.","alternativas":["Sentadilla sissy","Prensa con pies bajos"]},{"orden":6,"ejercicioId":"pullover_polea","nombre":"Pullover en polea alta","grupo":"Dorsal","series":2,"reps":"12-15","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"Brazos casi extendidos, llevar la barra hacia los muslos sin flexionar los codos. Torso inclinado y quieto.","alternativas":["Pullover con mancuerna","Jalon con brazos rectos en cuerda"]},{"orden":7,"ejercicioId":"pallof_press","nombre":"Pallof press","grupo":"Core","series":2,"reps":"12 por lado","rir":4,"descansoSegundos":75,"esBasico":false,"tecnica":"De costado a la polea, extender los brazos al frente resistiendo la rotacion. La cadera no se mueve.","alternativas":["Plancha lateral","Pallof con banda elastica"]}]},{"id":"s4-cardio1","clave":"CARDIO","tipo":"cardio","diaSugerido":"Martes","nombre":"Cardio continuo suave (25 min)","duracionEstimadaMin":25,"entradaEnCalor":"5 min progresivos hasta llegar al ritmo objetivo.","ejercicios":[{"orden":1,"ejercicioId":"liss","nombre":"Correr, bici o natacion a ritmo conversado","grupo":"Cardiovascular","series":1,"reps":"25 min continuos","rir":null,"descansoSegundos":0,"esBasico":false,"tecnica":"Ritmo en el que se puede mantener una conversacion con frases completas. Si cuesta hablar, esta yendo demasiado rapido. Este tipo de cardio no interfiere con la recuperacion del gimnasio.","alternativas":["Bicicleta","Natacion","Eliptica","Caminata en pendiente"]}]},{"id":"s4-caminata","clave":"MOVILIDAD","tipo":"deporte","diaSugerido":"Domingo","nombre":"Descanso activo: caminata larga o movilidad","duracionEstimadaMin":40,"entradaEnCalor":"No hace falta. Caminata tranquila al aire libre, o 20 min de movilidad de cadera, tobillo y columna toracica si hay rigidez acumulada.","ejercicios":[]}]}],"notas":["Para ganar musculo hace falta comer suficiente, no menos. Con un objetivo de recomposicion en un peso corporal ya normal, restringir calorias es el error mas comun y el que frena el progreso. La proteina distribuida a lo largo del dia es la variable que mas importa.","Para ajustar la alimentacion a este objetivo, lo indicado es una consulta con un nutricionista deportivo antes que seguir numeros genericos.","Dormir 7 a 9 horas. Es la variable de recuperacion que mas incide en la ganancia de musculo y la unica que no se compensa con nada.","Registrar el peso y las repeticiones de cada serie. Sin ese registro, con tres anios de experiencia el progreso se vuelve invisible y la motivacion cae.","Si aparece dolor articular puntual (no la molestia muscular normal de 24 a 48 horas), cambiar por la alternativa indicada en el ejercicio y consultar si persiste.","Si el ciclo menstrual afecta el rendimiento en alguna fase, se puede correr una sesion de dia o quedarse en RIR 3 sin que eso comprometa el plan. La flexibilidad semanal esta contemplada."]} , hombres: {"meta":{"titulo":"Planificación hombres","objetivo":"Rutina dividida de 4 días: pecho y tríceps, hombros, espalda y bíceps, piernas","duracionSemanas":4,"sesionesFuerzaPorSemana":4},"principios":[{"titulo":"Entrada en calor","detalle":"Recordá entrar bien en calor el grupo muscular a trabajar antes de la primera serie efectiva."},{"titulo":"Descansos","detalle":"90 segundos entre series para tren superior y 120 segundos para tren inferior. El timer de cada ejercicio ya viene configurado."},{"titulo":"Hidratación","detalle":"La hidratación debe estar antes, durante y después de cada entrenamiento."},{"titulo":"Triserie de tríceps","detalle":"Circuito de 3 vueltas: jalón en polea, trasnuca a un brazo y patada, 8 repeticiones cada uno, sin descanso entre ejercicios. Descansá 90 s al terminar cada vuelta."},{"titulo":"Registro y progresión","detalle":"Anotá peso y repeticiones de cada serie (ej. 40x10, 40x9). La semana siguiente vas a ver el registro anterior para intentar superarlo."}],"calendarioSemanal":[{"dia":"Día 1","actividad":"Pecho y tríceps","tipo":"fuerza"},{"dia":"Día 2","actividad":"Hombros","tipo":"fuerza"},{"dia":"Día 3","actividad":"Espalda y bíceps","tipo":"fuerza"},{"dia":"Día 4","actividad":"Piernas","tipo":"fuerza"}],"catalogoEjercicios":{"press_banca_plano":{"nombre":"Press con barra en banco plano","grupo":"Pecho","tecnica":"Escápulas retraídas y pies firmes en el piso. Bajar la barra controlada hasta la parte baja del pecho y empujar sin rebotar.","alternativas":["Press plano con mancuernas","Press en máquina"]},"apertura_mancuernas":{"nombre":"Apertura con mancuernas en banco plano","grupo":"Pecho","tecnica":"Codos levemente /* =========================================================
   ESTADO / STORAGE (con soporte multi-perfil)
   ========================================================= */
const LS_PREFIX = 'rutina_';
const kTheme = LS_PREFIX + 'theme';
const kPerfil = LS_PREFIX + 'perfil';
const kWeek = () => `${LS_PREFIX}${perfilActual}_semana`;
const kPeso = (sesionId, ejercicioId) => `${LS_PREFIX}${perfilActual}_peso_${sesionId}_${ejercicioId}`;
const kDone = (sesionId) => `${LS_PREFIX}${perfilActual}_done_${sesionId}`;

function lsGet(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){ /* storage no disponible */ }
}

/* Migracion: la version anterior (un solo perfil) guardaba las claves sin
   prefijo de perfil. Se copian una sola vez al perfil "propia" para no
   perder el registro ya cargado. */
function migrarDatosLegacy(){
  if(lsGet(LS_PREFIX + 'migrado_perfiles', '') === '1') return;
  try{
    const legacySemana = localStorage.getItem(LS_PREFIX + 'semana');
    if(legacySemana !== null) lsSet(`${LS_PREFIX}propia_semana`, legacySemana);
    const total = localStorage.length;
    for(let i = 0; i < total; i++){
      const key = localStorage.key(i);
      if(!key) continue;
      if(key.startsWith(LS_PREFIX + 'peso_') || key.startsWith(LS_PREFIX + 'done_')){
        const newKey = key.replace(LS_PREFIX, `${LS_PREFIX}propia_`);
        if(localStorage.getItem(newKey) === null){
          lsSet(newKey, localStorage.getItem(key));
        }
      }
    }
  }catch(e){ /* storage no disponible */ }
  lsSet(LS_PREFIX + 'migrado_perfiles', '1');
}
migrarDatosLegacy();

let perfilActual = lsGet(kPerfil, 'propia');
if(!PLANES[perfilActual]) perfilActual = 'propia';
let DATA = PLANES[perfilActual];

let currentWeek = parseInt(lsGet(kWeek(), '1'), 10) || 1;
if(currentWeek < 1 || currentWeek > DATA.semanas.length) currentWeek = 1;

/* =========================================================
   TEMA
   ========================================================= */
function applyTheme(theme){
  document.documentElement.dataset.theme = theme;
  document.getElementById('theme-toggle').textContent = theme === 'dark' ? '🌙' : '☀️';
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', theme === 'dark' ? '#0f1115' : '#f4f5f7');
}
applyTheme(lsGet(kTheme, 'dark'));
document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  lsSet(kTheme, next);
  applyTheme(next);
});

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* =========================================================
   HEADER / SELECTOR DE PERFIL Y DE SEMANA
   ========================================================= */
function renderHeader(){
  document.getElementById('app-title').textContent = DATA.meta.titulo;
  document.getElementById('app-objetivo').textContent = DATA.meta.objetivo;
}

function renderProfileSelect(){
  const wrap = document.getElementById('profile-select');
  wrap.innerHTML = '';
  PERFILES.forEach(p => {
    const btn = document.createElement('button');
    btn.textContent = p.etiqueta;
    btn.className = p.id === perfilActual ? 'active' : '';
    btn.addEventListener('click', () => {
      if(perfilActual === p.id) return;
      perfilActual = p.id;
      lsSet(kPerfil, perfilActual);
      DATA = PLANES[perfilActual];
      currentWeek = parseInt(lsGet(kWeek(), '1'), 10) || 1;
      if(currentWeek < 1 || currentWeek > DATA.semanas.length) currentWeek = 1;
      renderHeader();
      renderProfileSelect();
      renderAll();
      renderPrincipios();
      renderCalendario();
      renderNotas();
    });
    wrap.appendChild(btn);
  });
}

function renderWeekSelect(){
  const wrap = document.getElementById('week-select');
  wrap.innerHTML = '';
  DATA.semanas.forEach(s => {
    const btn = document.createElement('button');
    btn.textContent = s.numero;
    btn.className = s.numero === currentWeek ? 'active' : '';
    btn.addEventListener('click', () => {
      if(currentWeek === s.numero) return;
      currentWeek = s.numero;
      lsSet(kWeek(), String(currentWeek));
      renderAll();
    });
    wrap.appendChild(btn);
  });
}

/* =========================================================
   BLOQUE DESTACADO DE SEMANA
   ========================================================= */
function countCompleted(semana){
  let done = 0;
  semana.sesiones.forEach(s => { if(lsGet(kDone(s.id), '0') === '1') done++; });
  return done;
}

function renderWeekHighlight(semana){
  const el = document.getElementById('week-highlight');
  const done = countCompleted(semana);
  el.innerHTML = `
    <div class="week-label">Semana ${semana.numero} de ${DATA.semanas.length}</div>
    <h2>${escapeHtml(semana.titulo)}</h2>
    <div class="foco">${escapeHtml(semana.foco)}</div>
    <div class="progreso" id="progreso-txt">${done} de ${semana.sesiones.length} sesiones completadas</div>
  `;
}
function refreshProgreso(semana){
  const el = document.getElementById('progreso-txt');
  if(el) el.textContent = `${countCompleted(semana)} de ${semana.sesiones.length} sesiones completadas`;
}

/* =========================================================
   TIMER DE DESCANSO
   ========================================================= */
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.55);
    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 700);
  }catch(e){ /* audio no disponible */ }
  if(navigator.vibrate) navigator.vibrate([250,100,250,100,250]);
}
function fmtTime(sec){
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function setupTimer(rowEl, totalSeconds){
  const btn = rowEl.querySelector('.timer-btn');
  const resetBtn = rowEl.querySelector('.timer-reset');
  const numEl = btn.querySelector('.tnum');
  let remaining = totalSeconds;
  let interval = null;
  let running = false;

  function render(){ numEl.textContent = fmtTime(remaining); }
  function tick(){
    remaining--;
    if(remaining <= 0){
      remaining = 0;
      render();
      stop();
      beep();
      return;
    }
    render();
  }
  function start(){
    running = true;
    btn.classList.add('running');
    interval = setInterval(tick, 1000);
  }
  function stop(){
    running = false;
    btn.classList.remove('running');
    clearInterval(interval);
  }
  btn.addEventListener('click', () => {
    if(running){ stop(); }
    else{
      if(remaining <= 0) remaining = totalSeconds;
      start();
    }
  });
  resetBtn.addEventListener('click', () => {
    stop();
    remaining = totalSeconds;
    render();
  });
  render();
}

/* =========================================================
   SESIONES
   ========================================================= */
function findPrevWeekSession(semana, sesion){
  const idx = DATA.semanas.findIndex(s => s.numero === semana.numero);
  if(idx <= 0) return null;
  const prevSemana = DATA.semanas[idx - 1];
  return prevSemana.sesiones.find(s => s.clave === sesion.clave) || null;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function renderExerciseRow(semana, sesion, ej){
  const row = document.createElement('div');
  row.className = 'ex-row' + (ej.esBasico ? ' basico' : '');

  const pesoKey = kPeso(sesion.id, ej.ejercicioId);
  const pesoValue = lsGet(pesoKey, '');

  const prevSesion = findPrevWeekSession(semana, sesion);
  let prevHint = '';
  if(prevSesion){
    const prevVal = lsGet(kPeso(prevSesion.id, ej.ejercicioId), '');
    if(prevVal){
      prevHint = `<div class="peso-hint">Semana anterior: <b>${escapeHtml(prevVal)}</b></div>`;
    }
  }

  const altList = (ej.alternativas || []).map(a => `<li>${escapeHtml(a)}</li>`).join('');

  row.innerHTML = `
    <div class="ex-row-head">
      <div class="ex-order">${ej.orden}</div>
      <div class="ex-icon-wrap">${iconSvg(ej.icono || ej.ejercicioId, 22)}</div>
      <div class="ex-title">
        <div class="ex-nombre">${escapeHtml(ej.nombre)}${ej.esBasico ? '<span class="ex-tag-basico">Básico</span>' : ''}</div>
      </div>
    </div>
    <div class="ex-stats">
      <div class="stat"><div class="num">${ej.series}</div><div class="lbl">Series</div></div>
      <div class="stat"><div class="num">${escapeHtml(ej.reps)}</div><div class="lbl">Reps</div></div>
      <div class="stat"><div class="num">${ej.rir === null || ej.rir === undefined ? '—' : ej.rir}</div><div class="lbl">RIR</div></div>
      <div class="stat"><div class="num">${ej.descansoSegundos ? fmtTime(ej.descansoSegundos) : '—'}</div><div class="lbl">Descanso</div></div>
    </div>
    <div class="ex-extra">
      <div class="peso-field">
        <label for="peso-${sesion.id}-${ej.ejercicioId}">Peso / registro</label>
        <input type="text" id="peso-${sesion.id}-${ej.ejercicioId}" class="peso-input" data-key="${pesoKey}" placeholder="ej. 40x10, 40x9, 35x10" value="${escapeHtml(pesoValue)}">
        ${prevHint}
      </div>
      <div class="row-actions">
        ${ej.descansoSegundos ? `
        <button class="btn timer-btn"><span>⏱</span><span class="tnum"></span></button>
        <button class="btn timer-reset">↺ reiniciar</button>` : ''}
        ${(ej.tecnica || altList) ? `<button class="btn tecnica-toggle">👁 ver técnica</button>` : ''}
      </div>
      ${(ej.tecnica || altList) ? `
      <div class="tecnica-panel" hidden>
        <div class="ex-icon-big">${iconSvg(ej.icono || ej.ejercicioId, 56)}</div>
        <div class="tec-txt">${escapeHtml(ej.tecnica || '')}</div>
        ${altList ? `<div class="alt-title">Alternativas</div><ul>${altList}</ul>` : ''}
      </div>` : ''}
    </div>
  `;

  const pesoInput = row.querySelector('.peso-input');
  pesoInput.addEventListener('input', () => {
    lsSet(pesoKey, pesoInput.value);
  });

  const tecBtn = row.querySelector('.tecnica-toggle');
  if(tecBtn){
    tecBtn.addEventListener('click', () => {
      const panel = row.querySelector('.tecnica-panel');
      const isHidden = panel.hidden;
      panel.hidden = !isHidden;
      tecBtn.textContent = isHidden ? '🙈 ocultar técnica' : '👁 ver técnica';
    });
  }

  if(ej.descansoSegundos){
    setupTimer(row, ej.descansoSegundos);
  }

  return row;
}

function renderSessionCard(semana, sesion){
  const details = document.createElement('details');
  details.className = 'session-card';
  details.dataset.tipo = sesion.tipo;

  const isDone = lsGet(kDone(sesion.id), '0') === '1';
  if(isDone) details.classList.add('completed');

  const tipoIcon = { fuerza: '🏋️', cardio: '🚶', deporte: '⚽' }[sesion.tipo] || '•';

  const summary = document.createElement('summary');
  summary.innerHTML = `
    <span class="chk-wrap"><input type="checkbox" class="done-chk" ${isDone ? 'checked' : ''} aria-label="Marcar sesión completada"></span>
    <span class="info">
      <span class="dia">${escapeHtml(sesion.diaSugerido)} · ${tipoIcon} ${escapeHtml(sesion.tipo)}</span>
      <span class="nombre">${escapeHtml(sesion.nombre)}</span>
      <span class="meta">${sesion.duracionEstimadaMin ? sesion.duracionEstimadaMin + ' min aprox.' : ''}</span>
    </span>
    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  `;
  details.appendChild(summary);

  const chk = summary.querySelector('.done-chk');
  chk.addEventListener('click', e => e.stopPropagation());
  chk.addEventListener('change', () => {
    lsSet(kDone(sesion.id), chk.checked ? '1' : '0');
    details.classList.toggle('completed', chk.checked);
    refreshProgreso(semana);
  });

  const body = document.createElement('div');
  body.className = 'session-body';

  if(sesion.entradaEnCalor){
    body.innerHTML += `<div class="warmup"><b>Entrada en calor</b>${escapeHtml(sesion.entradaEnCalor)}</div>`;
  }

  if(sesion.ejercicios && sesion.ejercicios.length){
    sesion.ejercicios.forEach(ej => {
      body.appendChild(renderExerciseRow(semana, sesion, ej));
    });
  } else if(sesion.tipo === 'deporte'){
    body.innerHTML += `<div class="deporte-note">Día de deporte libre. Enfocate en el calentamiento de arriba antes de entrar a jugar.</div>`;
  }

  details.appendChild(body);
  return details;
}

function renderSessions(semana){
  const wrap = document.getElementById('sessions');
  wrap.innerHTML = '';
  semana.sesiones.forEach(sesion => {
    wrap.appendChild(renderSessionCard(semana, sesion));
  });
}

/* =========================================================
   EXPORTAR
   ========================================================= */
document.getElementById('export-btn').addEventListener('click', () => {
  const dump = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);
      if(key && key.startsWith(LS_PREFIX)){
        dump[key] = localStorage.getItem(key);
      }
    }
  }catch(e){ /* storage no disponible */ }

  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `rutina-registro-${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Registro exportado');
});

/* =========================================================
   RENDER GENERAL
   ========================================================= */
function renderAll(){
  const semana = DATA.semanas.find(s => s.numero === currentWeek) || DATA.semanas[0];
  renderWeekSelect();
  renderWeekHighlight(semana);
  renderSessions(semana);
}

renderHeader();
renderProfileSelect();
renderAll();
renderPrincipios();
renderCalendario();
renderNotas();
